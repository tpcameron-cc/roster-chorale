name: Idea or feature request
description: Suggest something that would make Roster Chorale better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: The problem it solves or what you'd use it for.
