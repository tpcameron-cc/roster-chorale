[project]
name = "roster-chorale"
version = "0.1.0"
description = "Turn Bach chorales into band parts scored for your actual roster and grade."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "music21==10.5.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
